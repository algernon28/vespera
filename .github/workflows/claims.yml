name: claims

# AGENTS.md is the file an agent reads before doing anything, and it had drifted six
# claims away from the tree without a single check going red: docs.yml filters on
# docs/**, and AGENTS.md is at the root, so nothing had ever opened it.
#
# No paths filter, deliberately, and for two separate reasons:
#
#   1. A change anywhere in src/ can falsify a sentence here. Adding a module package,
#      or a class named *IT, makes AGENTS.md wrong without touching AGENTS.md.
#   2. One claim can rot with no commit at all. The wayfinder map named as current
#      closes on the tracker, and nothing in this repository changes when it does --
#      which is exactly how issue #1 stayed named as current for ten days after it
#      closed. The daily schedule catches it with no commit at all.
#
# On a pull request that claim is NOT CHECKED (ADR-350 §1): the tracker's labels are
# no change of the pull request's, and a branch cut before main's last edit to
# AGENTS.md would go red for a label it never touched. Main's push, the schedule, a
# dispatch and a run outside CI read it.
#
# Named for what it checks rather than for what it runs. build.yml carries the same
# note, after a job called "verify" was read as evidence the Java build had run.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: claims-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agents-md:
    name: AGENTS.md still describes this tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history, so that origin/main has a merge base with the pull request's head (ADR-342 §6).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # --with-network turns the map check from NOT CHECKED into a real result, on main's
      # push, the schedule and a dispatch; and it reads the open pull requests for the
      # numbers a branch's records take, on every event. The token a workflow already
      # has is enough to read a public issue.
      - name: The countable claims AGENTS.md makes
        run: node docs/check-claims.mjs --with-network
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: The script that updates the review register
        run: node --test src/test/docs/review-register.test.mjs

      - name: The functions the claims check computes
        run: node --test src/test/docs/check-claims.test.mjs
