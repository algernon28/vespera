name: build

# The Java build, run where each half of it can actually be proven.
#
# Two jobs and not one, because the test suite is deliberately split across two filesystems
# (ADR-065) and no single runner offers both:
#
#   * The integration test starts Chroma and Ollama through Testcontainers, which needs a Docker
#     daemon running Linux containers. GitHub's Windows runners cannot do that.
#   * The identity tests build their fixtures on NTFS -- an entry whose name has no UTF-8 encoding,
#     an ACL-denied directory, a path too long to open. On Linux each one aborts by design, so a
#     Linux-only build would report success having run none of them.
#
# Running only the first would leave the walk unproven where ADR-065 says it must be proven, and it
# would say so nowhere: an aborted test is a skip, and a skip is green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No paths filter. The docs workflow has one because it checks generated pages; this checks the
# code, and a change anywhere in the tree can break it.

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Linux, with the sidecars
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, and this is load-bearing rather than tidy. The build stamps each module
          # with the SHA of the last commit touching it (ADR-058), by asking git. A shallow clone
          # has one commit, so git answers for almost no module, the build writes "unknown", and
          # the jar it produces is one that can mint no run at all.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26
          cache: maven

      # verify, not test: the integration test is bound to failsafe and excluded from surefire, so
      # `mvnw test` never reaches it. Docker is already running on this runner.
      - run: ./mvnw -B verify

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-linux
          path: target/allure-results
          if-no-files-found: warn

  ntfs:
    name: Test on NTFS
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26
          cache: maven

      # test, not verify: the integration test needs Linux containers, which this runner has no way
      # to start. What this job is here for is the tests that only a real NTFS volume is evidence
      # for, and those are surefire's.
      - run: ./mvnw.cmd -B test

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ntfs
          path: target/allure-results
          if-no-files-found: warn
