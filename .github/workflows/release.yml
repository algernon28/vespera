name: release

# ADR-444: every push to main is released. Its version is computed, never typed: the previous v tag raised by the
# greatest bump the decision records merged since it name (node docs/release.mjs next). The tag is made here, the jar
# built from it, and the tag pushed only once the build and ADR-431 §8's refusals have passed. Every rule is held in
# docs/release.mjs (ADR-431 §8), so this file carries none of its own.

on:
  push:
    branches: [main]

permissions:
  contents: write

# One release at a time, in the order main moved; a later push waits rather than cancelling one being published.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The whole history, so that no module's implementation version is "unknown" (ADR-272), and the tags, which the
      # previous tag, the next version and the notes are read from.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ADR-444 §3: nothing where this commit already carries a release tag.
      - name: Compute the version
        id: next
        run: |
          version="$(node docs/release.mjs next)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # Made here and pushed last, so the git-versioning extension builds this version and a failed build leaves no tag.
      - name: Tag the commit
        if: steps.next.outputs.version != ''
        run: git tag "${{ steps.next.outputs.tag }}"

      # ADR-431 §8's first and third rules.
      - name: Refuse a tag that is no release
        if: steps.next.outputs.version != ''
        run: node docs/release.mjs check "${{ steps.next.outputs.tag }}"

      - uses: actions/setup-java@v4
        if: steps.next.outputs.version != ''
        with:
          distribution: temurin
          java-version: 26
          cache: maven

      # As the Linux job of build.yml builds, so a released jar is one the suite passed; the version is the tag's.
      - if: steps.next.outputs.version != ''
        run: ./mvnw -B verify -DexcludedGroups=confluence

      # ADR-431 §8's second and fourth rules, read off the jar.
      - name: Refuse a jar that names another version or could mint no run
        if: steps.next.outputs.version != ''
        run: |
          jar="target/vespera-${{ steps.next.outputs.version }}.jar"
          unzip -p "$jar" META-INF/MANIFEST.MF > "$RUNNER_TEMP/manifest.txt"
          unzip -p "$jar" BOOT-INF/classes/implementation-versions.properties > "$RUNNER_TEMP/implementation-versions.txt"
          node docs/release.mjs built "${{ steps.next.outputs.tag }}" "$RUNNER_TEMP/manifest.txt" "$RUNNER_TEMP/implementation-versions.txt"

      - name: Write the notes
        if: steps.next.outputs.version != ''
        run: node docs/release.mjs notes "${{ steps.next.outputs.tag }}" > "$RUNNER_TEMP/notes.md"

      - name: Push the tag and create the release
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin "${{ steps.next.outputs.tag }}"
          gh release create "${{ steps.next.outputs.tag }}" \
            "target/vespera-${{ steps.next.outputs.version }}.jar" \
            --title "${{ steps.next.outputs.tag }}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
