vespera:
  # Bound empty so no test inherits a corpus root from the shipped application.yaml. That file is
  # layered under this one, not replaced, so a vespera.corpus-root added there -- for a local archive
  # someone runs against every day -- reaches every test context too. UnconfiguredRootTest asserts a
  # refusal that only happens when nothing names a root, and it walked the real archive for half a
  # minute before failing about an exit code when that happened. Empty and absent are the same thing
  # to the command, which checks for blank, so binding it here costs nothing the tests rely on.
  corpus-root: ""

# Loaded on top of src/main/resources/application.yaml when the "test" profile is active,
# because a profile-specific file layers rather than replaces. An identically named
# application.yaml here would shadow the main one entirely instead — same classpath
# resource name, test-classes first — which is how the Chroma setting below went missing
# once already.
#
# The datasource is test-only. Where the real database lives is still an open decision
# (issue #11), so nothing here settles it: this exists so the context can be built at all,
# and it is in-memory precisely so it cannot become the answer by default.
spring:
  datasource:
    # foreign_keys=on: SQLite ignores FK constraints per-connection unless told otherwise, so
    # walk_id references in schema.sql would silently accept orphans without this.
    url: "jdbc:sqlite::memory:?foreign_keys=on"
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite's :memory: database is scoped to one connection: a second connection sees an
      # empty database. Pinning the pool to one connection is what lets schema.sql and every
      # query in a test land on the same database rather than a fresh one each time.
      maximum-pool-size: 1
      # And the connection is never retired, which the shipped file's settings would otherwise do
      # after 35 seconds. There, retiring one releases a file lock; here it would throw away the
      # database itself, schema and all, and hand the next query an empty one. A pool of one is also
      # a fixed-size pool by definition, so an idleTimeout it can never act on is turned off rather
      # than inherited and warned about at every context load.
      max-lifetime: 0
      idle-timeout: 0
  batch:
    jdbc:
      initialize-schema: never
