# Where the adapters write results, read by both surefire and failsafe so the two suites
# land in one place and one report covers the whole build. The path is relative to the
# forked JVM's working directory, which Maven sets to the project base directory.
#
# allure-maven reads the same directory, and maven-clean-plugin empties it before the run:
# both are configured in pom.xml and have to keep pointing here.
# https://allurereport.org/docs/junit5/
allure.results.directory=target/allure-results

# Turns @Issue("6") into a link to the ticket, so a test can carry its reference without
# spelling it out in a name that has to read plainly on its own.
allure.link.issue.pattern=https://github.com/algernon28/vespera/issues/{}
