# Read by Spring Modulith's ApplicationModules in the tests alone (ADR-367 section 2); nothing the jar ships reads it.
#
# The capability modules lie one level below engine/ and publish/, not directly under the application package, so
# Modulith's default (a module is a direct sub-package of VesperaApplication's package) would find two modules,
# engine and publish, and every package-info's allowedDependencies would stop applying. Only a package that carries
# @ApplicationModule is a module under this strategy, and each declares its short id, so a module is still "ledger"
# and not "engine.ledger". The control panel (ui) declares none and so is no module.
#
# This file is named application.properties, not application.yaml, so that it adds to src/main/resources/application.yaml
# instead of shadowing it (AGENTS.md, Building and testing).
spring.modulith.detection-strategy=explicitly-annotated
