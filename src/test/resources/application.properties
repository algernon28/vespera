# The jar carries no configuration Spring reads: its application.yaml is a shipped copy under beside-the-jar/, which
# the jar writes into the folder beside it where none is there, and which Spring's own locations never read (ADR-397
# section 2). A context Spring's test support builds reads that copy here, so every test context starts from what the
# jar ships, as it did when the file lay at the class path's root (ADR-397 section 8). An imported file stands over the
# file that imports it and under application-test.yaml, the test profile's own file, which stands over both.
spring.config.import=classpath:/beside-the-jar/application.yaml
# Read by Spring Modulith's ApplicationModules in the tests alone (ADR-367 section 2); nothing the jar ships reads it.
#
# The capability modules lie one level below engine/ and publish/, not directly under the application package, so
# Modulith's default (a module is a direct sub-package of VesperaApplication's package) would find two modules,
# engine and publish, and every package-info's allowedDependencies would stop applying. Only a package that carries
# @ApplicationModule is a module under this strategy, and each declares its short id, so a module is still "ledger"
# and not "engine.ledger". The control panel (ui) declares none and so is no module.
#
# This file is named application.properties, not application.yaml, so that it never takes the name of the file the
# folder beside the jar holds.
spring.modulith.detection-strategy=explicitly-annotated
