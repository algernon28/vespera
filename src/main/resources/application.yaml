vespera:
  # Where the database and profile.yaml live, together and apart from the corpus (ADR-054). It is
  # explicit operator configuration and never derived from the corpus root, so census can run
  # against a read-only mount. --db-dir=<path> overrides it for one invocation; it has to be a
  # property rather than only a CLI option, because the datasource is built from it long before the
  # command line is parsed.
  working-dir: ${db-dir:${user.dir}/.vespera}
  docling:
    # docling-serve is a managed sidecar (ADR-011), same as Chroma and Ollama, but unlike them
    # carries no Spring Boot auto-configuration or ServiceConnection support -- there is no
    # published connection-details factory for it to derive a URL from a running container the way
    # spring-ai's starters do for Chroma/Ollama. compose.yaml pins its host port to match, so this
    # default is correct for `vespera run` against the sidecar compose.yaml declares; a test
    # overrides it from the Testcontainers-mapped port instead (see TestcontainersConfiguration).
    base-url: http://localhost:5001

spring:
  application:
    name: vespera
  datasource:
    # One SQLite file, holding everything (ADR-008, ADR-009). foreign_keys=on because SQLite ignores
    # foreign key constraints per connection unless told otherwise, and schema.sql's walk_id
    # references would silently accept orphans without it.
    # journal_mode=WAL, because stage 2 converts four documents at a time and SQLite's default
    # rollback journal makes a writer block readers outright. WAL's own documentation puts it as
    # "writers do not block readers and readers do not block writers" -- it does not give a second
    # writer (there is one WAL file, so one writer), which is why the write transactions themselves
    # are kept short in ExtractionCache#put and its two neighbours. Two consequences worth knowing:
    # WAL writes vespera.db-wal and vespera.db-shm beside the database, so ADR-008's one file is
    # three on disk between checkpoints; and WAL needs shared memory, so it silently stays in the
    # previous mode on a network filesystem, where SQLite advises against multi-process access
    # anyway.
    #
    # busy_timeout, because the effective value was otherwise sqlite-jdbc's own 3s default and
    # nothing here said so. Thirty seconds is far longer than any write now holds the lock, so a
    # collision waits and proceeds instead of surfacing as SQLITE_BUSY.
    url: "jdbc:sqlite:${vespera.working-dir}/vespera.db?foreign_keys=on&journal_mode=WAL&busy_timeout=30000"
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite locks the database file for a write, so a pooled connection that sits on one turns the
      # next writer's attempt into "The database file is locked (database is locked)" - the error these
      # settings exist for, and whose own advice is a shorter maxLifetime. A connection is therefore
      # retired quickly rather than kept warm, and a stage that waits on a lock waits a long time
      # rather than failing: the pipeline runs unattended for days (ADR-035), and a five-minute wait
      # for a lock is cheaper than a failed run.
      connection-timeout: 300000
      validation-timeout: 300000
      connection-test-query: SELECT 1
      max-lifetime: 35000
      idle-timeout: 15000
      # idleTimeout does nothing unless the pool can actually shrink, and minimumIdle defaults to
      # maximumPoolSize - a fixed-size pool that retires nothing and says so at every boot
      # ("idleTimeout has been set but has no effect"). One is the floor the rest grow back from.
      minimum-idle: 1
      # Two per extraction thread and room to spare. Each of stage 2's four threads now holds its
      # chunk transaction's connection while a suspended REQUIRES_NEW write takes a second one, and
      # the reader takes one to fetch a page. At the default ten, a run could exhaust the pool and
      # then wait out connection-timeout above -- five minutes of nothing, for want of a connection
      # that costs nothing to allow.
      maximum-pool-size: 16
      # Off, not left at its two-minute default: a keepalive ping is exactly what holds a connection,
      # and its lock, past the 35s lifetime above. Hikari disables it by itself here anyway, since
      # keepaliveTime >= maxLifetime, and warns on every boot while doing so.
      keepalive-time: 0
  sql:
    init:
      # SQLite isn't one of the databases Spring Boot auto-detects as embedded, so schema.sql
      # is never run unless this is explicit (ADR-049: schema via schema.sql, no migration tool).
      mode: always
  batch:
    job:
      # An invocation is a person running a command against a root they named (ADR-047), never a
      # side effect of the application starting. The CLI launches the job; nothing else does.
      enabled: false
    jdbc:
      # No batch metadata tables: the job repository is resourceless (ADR-036), so there is no
      # schema for Batch to initialise and nothing of Batch's in the one database.
      initialize-schema: never
  ai:
    model:
      # Ollama is the default engine and serves locally (ADR-013), and which runtime serves is
      # configuration rather than code (ADR-012). The OpenAI starter is on the classpath for the
      # bake-off's reference model (ADR-034) and is selected per invocation, never by default --
      # naming the model here is also what keeps its auto-configuration from demanding an API key
      # the moment the application starts.
      chat: ollama
      embedding: ollama
      image: none
      moderation: none
      audio:
        transcription: none
        speech: none
    vectorstore:
      chroma:
        # Chroma is a derived, disposable projection of the vectors SQLite holds
        # authoritatively (ADR-039), so it may be created and rebuilt at will.
        initialize-schema: true
