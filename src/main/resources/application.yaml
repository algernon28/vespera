vespera:
  # Where the database and profile.yaml live, together and apart from the corpus (ADR-054). It is
  # explicit operator configuration and never derived from the corpus root, so census can run
  # against a read-only mount. --db-dir=<path> overrides it for one invocation; it has to be a
  # property rather than only a CLI option, because the datasource is built from it long before the
  # command line is parsed.
  working-dir: ${db-dir:${user.dir}/.vespera}
  # The corpus root `vespera run` walks when the command names none (ADR-066): the argument names it,
  # and this is only the fallback. It ships empty, which the command treats as unset -- it refuses
  # rather than guess, because a census of the wrong tree reports success. A root is one machine's
  # archive, and this file is committed and packed into the jar, so set it per machine instead: in
  # application-local.yaml, as the environment variable VESPERA_CORPUS_ROOT (VESPERA_CORPUSROOT is
  # read too), or with --vespera.corpus-root=<path>.
  corpus-root: ""
  # The folder the deliverable is drawn at, with index.html at its top (ADR-276); empty draws it in the
  # working directory's deliverable folder. Set per machine, as VESPERA_DELIVERABLE_ROOT.
  deliverable-root:
  sidecars:
    # Whether `vespera run` and `vespera label --auto` start the Docker engine and bring docling-serve and Ollama up
    # when they are not answering (ADR-323). They run `docker compose -p vespera up -d --build --no-recreate` from
    # the compose files the jar carries, naming compose.gpu.yaml too where vespera.docling.image is the image it
    # builds, and recreate, stop or remove nothing. Set false (VESPERA_SIDECARS_START=false) for a machine whose
    # sidecars are started some other way, or to keep a stopped sidecar stopped. An application property and no
    # profile value: it says how this machine is run, not what has been judged about a corpus.
    start: true
    # How long any wait for the Docker engine or a sidecar lasts: after the engine is started, after `up`, at
    # stage 2's start for a converter that gives no answer yet, and after a dropped connection (ADR-323 §7,
    # amending ADR-175 §2). 180 seconds covers the restarts measured at 6 to 9 seconds and a first start that loads
    # its models.
    wait-at-most: 180s
  models:
    # Whether stage 5's scoring step and the generation step have Ollama pull a model it does not serve, through
    # /api/pull, before they send it anything (ADR-329). A model Ollama already serves is never pulled. Set false
    # (VESPERA_MODELS_PULL=false) to pull by hand. An application property and no profile value: it says how this
    # machine is connected, not what has been judged about a corpus.
    pull: true
    # How long a pull may go without moving, whether Ollama keeps sending lines that change nothing or sends none,
    # before Vespera stops waiting (ADR-329 section 6). Bounds the stall, not the pull's length.
    pull-stalled-at-most: 600s
  # How often report.json and report.html are rewritten in the working directory while an invocation runs (ADR-265, ADR-362).
  progress-interval: 5s
  docling:
    # docling-serve is a managed sidecar (ADR-011), same as Ollama, but unlike it
    # carries no Spring Boot auto-configuration or ServiceConnection support -- there is no
    # published connection-details factory for it to derive a URL from a running container the way
    # Spring AI's starter does for Ollama. compose.yaml pins its host port to match, so this
    # default is correct for `vespera run` against the sidecar compose.yaml declares; a test
    # overrides it from the Testcontainers-mapped port instead (see TestcontainersConfiguration).
    base-url: http://localhost:5001
    # The image compose.yaml runs the sidecar from, which the extractor identity carries (ADR-147):
    # two images reporting the same versions were measured to convert the same PDF differently. The
    # image reports its own name in /version, and a step that would record conversions under this one
    # stops when the sidecar runs another (ADR-179). The tag names the PDF parser pinned in place of the
    # base's own, docling-parse 7.17.0, because that changes conversions too (ADR-163), and the revision
    # of Vespera's own layers, -r2. Keep in step with compose.yaml and TestcontainersConfiguration.
    image: vespera/docling-serve-cpu-libreoffice:v1.32.0-docling-parse-7.17.0-r2
    # The OCR preset every conversion names, never docling-serve's `auto`, which resolves to whichever engine's models
    # are cached on the machine and is reported in no response (ADR-090, ADR-330). It decides which engine reads the
    # pictures of a document, and it is the preset in the extractor identity (ocr_preset=...): another one is another
    # extractor, so it enters the extraction run and every run after it, and every conversion is asked of the sidecar
    # again. A name of letters, digits, '-', '_' and '.', and never auto; `vespera run` refuses anything else.
    ocr-preset: rapidocr
    # How many timeouts in a row make the converter, and not the document, the fault: below it a timeout is the
    # document's own verdict (extraction-failed), at it the occurrence is set aside and the step stops on the next
    # (ADR-071, ADR-330). Held to 2 to 4, so that one slow document can still earn its verdict and the count stays
    # below the five failures in a row that stop the step. It enters the extraction run where it is not 3.
    timeouts-in-a-row: 3
  clustering:
    # How finely the documents under each exemplar divide into groups (ADR-087, ADR-330): the modularity resolution
    # of the communities, a finite number above 0, higher finding smaller groups. The profile's clusterResolution
    # overrides it for one corpus. It enters the embedding-scoring run, which the clusters are keyed by, where it is
    # not 1.0, and `cluster-sizes.html` shows what it did.
    resolution: 1.0
    # How many nearest neighbours each document keeps in the graph the groups are found in (ADR-087's k, ADR-330), a
    # whole number from 1. An operational number and no judgement about a corpus, so it has no profile key. It enters
    # the embedding-scoring run where it is not 15.
    neighbours: 15
  redundancy:
    # How many words one shingle spans (ADR-073, ADR-330), a whole number from 1. It decides what a passage shared by
    # two documents is, for stage 3's document frequency and stage 4's signatures and pairs. It enters the extraction
    # run, as word:<n>, where it is not 5, and every stage after it reads the shingles of that run.
    shingle-words: 5
    minhash:
      # How many minima make one MinHash signature (ADR-081, ADR-330), a whole number from 1; the bands times their rows
      # must be this number. Together with bands, rows-per-band and seed it enters the content-redundancy run, as the
      # signature's identity, where it is not the shipped one.
      permutations: 128
      # How many bands a signature is split into to retrieve near-duplicate candidates (ADR-081), a whole number from 1.
      bands: 16
      # How many minima each band covers (ADR-081), a whole number from 1.
      rows-per-band: 8
      # What every permutation is derived from (ADR-081): any whole number a Java long holds, negative ones included.
      # Only its stability across runs matters. 6840335614489015382 is 0x5EED_C0FF_EE12_3456 in decimal.
      seed: 6840335614489015382
    # The Jaccard similarity at or above which two documents are near-duplicates (ADR-079, ADR-081, ADR-330), above 0
    # and at most 1. It enters the content-redundancy run, as part of its cuts, where any of the four cuts is not the
    # shipped one, so that a run says which cuts judged it.
    near-duplicate-jaccard: 0.80
    # The containment index at or above which a smaller document counts as contained in a larger one (ADR-079,
    # ADR-081, ADR-330), above 0 and at most 1. It enters the content-redundancy run with the cuts.
    containment-index: 0.95
    # How many of a document's rarest shingles seed the search for a document that contains it (ADR-081, ADR-330), a
    # whole number from 1. It enters the content-redundancy run with the cuts.
    rare-shingle-sample: 32
    # How many of those rare shingles a document must hold to be a candidate container (ADR-081, ADR-330), a whole
    # number from 1 to the sample. It enters the content-redundancy run with the cuts.
    rare-shingle-hits: 24
  relevance:
    # How many of the highest chunk similarities a relevance score is the mean of (ADR-020, ADR-330), a whole number
    # from 1. It defines the score, so another number is another scale: it enters the embedding-scoring run where it
    # is not 3, and joins the scale a floor and an answer are compared on as `;top:<n>` after the embedder identity.
    top-similarities: 3
    sample:
      # Into how many equal bands the relevance report divides the scores (ADR-088, ADR-330), a whole number from 1.
      # It enters the embedding-scoring run where it is not 5, which draws its sample from its own id.
      bands: 5
      # How many documents the relevance report asks about from each band (ADR-088, ADR-330), a whole number from 1:
      # five bands of twelve are the sixty of one sitting. It enters the embedding-scoring run where it is not 12.
      per-band: 12

spring:
  # Spring's banner is logged, at INFO on the application's own logger, and not printed outside logback, so that it
  # stands in the stream, in the invocation's output file and in vespera.log alike (ADR-364 section 5).
  main:
    banner-mode: log
  application:
    name: vespera
  datasource:
    # One SQLite file, holding everything (ADR-008, ADR-009). foreign_keys=on because SQLite ignores
    # foreign key constraints per connection unless told otherwise, and schema.sql's walk_id
    # references would silently accept orphans without it. busy_timeout is a wait on a contended
    # database lock, and it is the knob that actually buys one: Hikari's connection-timeout times the
    # wait for a connection from the pool, which a contended write never engages (ADR-127).
    # journal_mode=WAL appends commits to the write-ahead log beside the database file instead of
    # journalling each page first, and synchronous=NORMAL syncs that write-ahead log at a WAL
    # checkpoint rather than at every commit. synchronous is per connection, so it rides on the URL
    # for every connection the pool opens; journal_mode=WAL is written into the database file by the
    # first connection, and the URL repeats it so that a new file starts that way.
    # journal_size_limit cuts an emptied write-ahead log back to 512 MiB (536870912 bytes) so one
    # very large transaction does not leave a write-ahead log that size on disk (ADR-180).
    url: "jdbc:sqlite:${vespera.working-dir}/vespera.db?foreign_keys=on&busy_timeout=300000&journal_mode=WAL&synchronous=NORMAL&journal_size_limit=536870912"
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite locks the database file for a write, so a pooled connection that sits on one turns the
      # next writer's attempt into "The database file is locked (database is locked)" - the error these
      # settings exist for, and whose own advice is a shorter maxLifetime. A connection is therefore
      # retired quickly rather than kept warm. The lock wait is the URL's busy_timeout, and the five
      # minutes it names are for the pipeline running unattended for days (ADR-035): a stage that
      # waits a lock out is cheaper than a run that fails. What follows times the wait for a
      # connection from the pool instead, which is a different wait (ADR-127).
      connection-timeout: 300000
      # A check on a local SQLite file answers in under a millisecond (measured, ADR-127), so this
      # bounds a check that cannot hang rather than buying a wait; five minutes had nothing behind it.
      validation-timeout: 5000
      connection-test-query: SELECT 1
      max-lifetime: 35000
      idle-timeout: 15000
      # idleTimeout does nothing unless the pool can actually shrink, and minimumIdle defaults to
      # maximumPoolSize - a fixed-size pool that retires nothing and says so at every boot
      # ("idleTimeout has been set but has no effect"). One is the floor the rest grow back from.
      minimum-idle: 1
      # Off, not left at its two-minute default: a keepalive ping is exactly what holds a connection,
      # and its lock, past the 35s lifetime above. Hikari disables it by itself here anyway, since
      # keepaliveTime >= maxLifetime, and warns on every boot while doing so.
      keepalive-time: 0
  sql:
    init:
      # SQLite isn't one of the databases Spring Boot auto-detects as embedded, so schema.sql
      # is never run unless this is explicit (ADR-049: schema via schema.sql, no migration tool).
      mode: always
  batch:
    job:
      # An invocation is a person running a command against a root they named (ADR-047), never a
      # side effect of the application starting. The CLI launches the job; nothing else does.
      enabled: false
    jdbc:
      # No batch metadata tables: the job repository is resourceless (ADR-036), so there is no
      # schema for Batch to initialise and nothing of Batch's in the one database.
      initialize-schema: never
  ai:
    model:
      # Ollama is the default engine and serves locally (ADR-013), and which runtime serves is
      # configuration rather than code (ADR-012). The reference model and every bake-off candidate
      # are local models served by the same Ollama (ADR-195), so no hosted starter is on the
      # classpath. Chat and embedding name Ollama explicitly, though it is also Spring AI's default
      # when they are unset. No starter here serves the kinds set to none; the keys stay so that
      # one added later is not switched on by default.
      chat: ollama
      embedding: ollama
      image: none
      moderation: none
      audio:
        transcription: none
        speech: none
    ollama:
      chat:
        options:
          # Which model stage 6b generates under (ADR-114). Like the embedding model's default below,
          # it is overridden by its profile key (generationModel here, embeddingModel there; ADR-298).
          # Unlike it -- whose default is changed only by a record (ADR-298), because it keys every
          # vector and every relevance verdict -- this one keys a run whose output is prose, so it is
          # not a gate. Chosen on friction and changeable without a new ADR (ADR-013's terms): it is
          # not a measured choice and beat nothing, and what stands behind a corpus is the generator
          # identity recording which weights actually answered.
          #
          # It lives here, where Spring AI's own auto-configuration reads it, rather than under a
          # vespera.* key, so the chat model bean and the call name one model instead of two.
          model: qwen3:8b
      embedding:
        options:
          # Which model stage 5 scores under (ADR-298): the profile's embeddingModel overrides it, and
          # blanking it gates stage 5 where the profile names none. Changed only by a record, because
          # it keys every vector and every relevance verdict (ADR-353).
          model: hf.co/Qwen/Qwen3-Embedding-8B-GGUF:Q4_K_M
