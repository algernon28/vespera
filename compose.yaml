# Pinned rather than floating, and the same versions TestcontainersConfiguration names -- a service
# present in one and absent from the other, or at a different version, means tests and runtime
# disagree about what exists. Raise both in one commit (ADR-012, ADR-032).
#
# Every host port is pinned to the container port it serves, and each one is pinned for the same
# reason: the value an operator's configuration already names has to be the value the container is
# actually on. No entry point reads a running container back or starts one: Spring Boot's compose
# support is not on any classpath, the jar's or the IDE's or spring-boot:run's (ADR-179). The
# operator starts these services with the `up` line the README gives, from every entry point, and
# nothing reads a port back, so the defaults in application.yaml and Spring AI (8000, 11434) are all
# an invocation has, and a Docker-assigned port makes them wrong. Pinning costs a port collision when
# something else local already holds one of these -- which is the failure an operator can diagnose
# from the message, unlike "Connection refused" against a container that is up.
services:
  chroma:
    image: 'chromadb/chroma:1.5.9'
    # Each service here is restarted by Docker if it exits on its own, including after the machine
    # restarts if Docker starts, but never after the operator stops it (ADR-164).
    restart: unless-stopped
    ports:
      - '8000:8000'
  ollama:
    # From this file alone it runs on the processor; compose.gpu.yaml gives it the GPU (ADR-165).
    image: 'ollama/ollama:0.33.2'
    restart: unless-stopped
    ports:
      - '11434:11434'
    # The image declares no volume, so without this its models (and the key pair beside them) live in
    # the container's own layer and go with any replacement of it. A named volume, not a bind mount,
    # so it depends on no host path. Only `down -v` removes it (ADR-179 §5).
    volumes:
      - 'ollama-models:/root/.ollama'
  docling-serve:
    # -cpu: docling-serve runs its CPU image here, the one that runs anywhere the rest of the stack
    # does. compose.gpu.yaml gives it the GPU too, through a CUDA build of the same Containerfile
    # under a tag of its own (ADR-170).
    #
    # This one has never had a choice about being pinned: there is no connection-details factory
    # for docling-serve to be read back from at all (ADR-071's own consequence -- "the exact
    # endpoint/health path... are the hand-off spec's"), so application.yaml's
    # vespera.docling.base-url default has to name a port the operator can rely on.
    #
    # Built here rather than pulled, because it adds LibreOffice to the pinned image so that .doc and
    # .ppt convert (ADR-147). The tag is ours and is the image vespera.docling.image names, which the
    # extractor identity carries: this image and the stock one report the same versions and convert
    # some PDFs differently. The tag also names the PDF parser the Containerfile pins in place of the
    # base's own, docling-parse 7.17.0, because a parser change converts PDFs differently too and a
    # tag that did not say so would let a machine keep running the old parser under the new name
    # (ADR-163). The -r2 is the revision of Vespera's own layers on that base and parser (ADR-179 §4).
    image: &docling-image 'vespera/docling-serve-cpu-libreoffice:v1.32.0-docling-parse-7.17.0-r2'
    build:
      context: docker/docling-serve
      dockerfile: Containerfile
      # The image bakes in the name it is built under and reports it in /version, which every step
      # that converts compares with vespera.docling.image before recording anything (ADR-179 §2).
      # Written once, as the alias of image above.
      args:
        VESPERA_IMAGE: *docling-image
    # An init process reaps the soffice each conversion starts; without one they stay behind as
    # zombies, one per file. Converting a file needs no capability and no privilege.
    init: true
    cap_drop:
      - ALL
    security_opt:
      - 'no-new-privileges:true'
    # This is the sidecar measured to crash (ADR-164): after a segmentation fault it answers /health
    # again about 17 seconds later, with no operator having to notice and run `docker start`.
    restart: unless-stopped
    # docling-serve answers 504 once a conversion has waited this long, queue time included, and
    # keeps converting anyway. Set well above Vespera's own 5-minute call timeout (ADR-071) so
    # that a slow file is Vespera's timeout to decide -- marked extraction-failed and the run goes
    # on -- rather than a 504 that stops stage 2 (ADR-172).
    environment:
      DOCLING_SERVE_MAX_SYNC_WAIT: '600'
    ports:
      - '5001:5001'
# Declared with no options: a Docker-managed volume, created by `up` (ADR-179 §5).
volumes:
  ollama-models:
